name: Build EasyColab Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "VERSION"
      - "windows_app/**"
      - "colab_bridge.py"
      - "app.py"
      - "runtime_auth.py"
      - "EasyColab_Server.ipynb"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }} (WinUI 3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python 3.12 (wheel download host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & package EasyColab (WinUI 3 + embedded Python bridge runtime)
        shell: pwsh
        run: ./windows_app/build_windows_app.ps1 -Arch ${{ matrix.arch }}

      - name: Smoke-test native window startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./windows_app/test_packaged_window.ps1 -ExePath ./dist/EasyColab/EasyColab.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyColab-Windows-${{ matrix.arch }}
          path: EasyColab-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (on tag push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyColab-Windows-${{ matrix.arch }}.zip
          generate_release_notes: true
